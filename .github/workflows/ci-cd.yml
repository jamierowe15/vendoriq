name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # needed for passwordless (OIDC) login to Azure
  contents: read

jobs:
  test:
    name: Test API and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API tests
        working-directory: server
        run: |
          npm ci
          npm test -- --coverage
      - name: Security audit (fail on high severity)
        working-directory: server
        run: npm audit --audit-level=high --omit=dev
      - name: Build frontend
        working-directory: client
        run: |
          npm ci
          npm run build

  # The deploy jobs only run after you finish the Azure setup (lab Part 10) and
  # set the repository variable DEPLOY_ENABLED to true.
  deploy-api:
    name: Deploy API to App Service
    needs: test
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: server

  deploy-web:
    name: Deploy frontend to Static Web Apps
    needs: test
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend with production settings
        working-directory: client
        env:
          VITE_TENANT_ID: ${{ vars.VITE_TENANT_ID }}
          VITE_SPA_CLIENT_ID: ${{ vars.VITE_SPA_CLIENT_ID }}
          VITE_API_CLIENT_ID: ${{ vars.VITE_API_CLIENT_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          action: upload
          app_location: client/dist
          output_location: ''
          skip_app_build: true
